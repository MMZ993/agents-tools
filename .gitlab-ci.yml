stages:
  - verify
  - build
  - integration
  - publish

default:
  tags:
    - docker

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

verify:
  image: ghcr.io/astral-sh/uv:0.10.0@sha256:78a7ff97cd27b7124a5f3c2aefe146170793c56a1e03321dd31a289f6d82a04f
  stage: verify
  script:
    - uv sync --frozen --all-groups
    - uv run pytest -v
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run ty check

verify_cli:
  image: golang:1.26.1
  stage: verify
  script:
    - cd cli
    - test -z "$(gofmt -l .)"
    - go vet ./...
    - command -v gcc
    - CGO_ENABLED=1 go test -race ./...
    - go build ./...

build_cli_artifact:
  image: golang:1.26.1
  stage: build
  needs: [verify_cli]
  script:
    - cd cli
    - mkdir -p dist
    - GOOS=linux GOARCH=amd64 go build -o dist/agents-tools .
    - tar -C dist -czf "dist/agents-tools-cli-linux-amd64-${CI_COMMIT_SHORT_SHA}.tar.gz" agents-tools
  artifacts:
    name: "agents-tools-cli-${CI_COMMIT_SHORT_SHA}"
    paths:
      - cli/dist/agents-tools
      - cli/dist/agents-tools-cli-linux-amd64-*.tar.gz
    expire_in: 14 days

integration_cli:
  image: ghcr.io/astral-sh/uv:0.10.0@sha256:78a7ff97cd27b7124a5f3c2aefe146170793c56a1e03321dd31a289f6d82a04f
  stage: integration
  needs: [verify, build_cli_artifact]
  script:
    - uv sync --frozen --all-groups
    - bash ./scripts/ci_smoke_cli.sh

publish_image:
  stage: publish
  needs: [verify, verify_cli, build_cli_artifact, integration_cli]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        if docker manifest inspect "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" >/dev/null 2>&1; then
          echo "refusing to overwrite existing release image tag"
          exit 1
        fi
        docker pull "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
        if [ "$(docker image inspect --format '{{ index .Config.Labels "io.mmz.agents-tools.source_ref" }}' "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA")" != "main" ]; then
          echo "refusing to release an image not built from main"
          exit 1
        fi
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      else
        if docker manifest inspect "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" >/dev/null 2>&1; then
          echo "refusing to overwrite existing commit-SHA image tag"
          exit 1
        fi
        docker build \
          --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
          --label "io.mmz.agents-tools.source_ref=$CI_COMMIT_REF_NAME" \
          -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
        docker run --rm "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" --help
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      fi
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_COMMIT_BRANCH == "main"'

publish_cli_package:
  image: golang:1.26.1
  stage: publish
  needs: [build_cli_artifact, integration_cli]
  script:
    - bash ./scripts/ci_publish_cli_package.sh
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ && $CI_COMMIT_REF_PROTECTED == "true"'
