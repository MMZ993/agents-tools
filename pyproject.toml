[project]
name = "agents-tools"
version = "0.1.0"
description = "Portable, policy-enforcing MCP broker runtime"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "jsonschema==4.26.0",
    "mcp==1.28.1",
    "prometheus-client==0.25.0",
    "pyyaml==6.0.3",
    "spotipy==2.25.1",
    "starlette==1.3.1",
    "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.22",
    "ty==0.0.61",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ty.environment]
python-version = "3.14"
